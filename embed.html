<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Moving Lines</title>
  <!-- The piece on its own, for embedding (the X player card in x/portrait/ loads this):
       a pre-rendered wash layer instead of the live p5.brush paint, no controls, a
       ghost cursor that keeps it scribbling until someone points at it, and a "tap to
       start" overlay whose tap also starts the sound. -->
  <style>
    html, body { margin: 0; height: 100%; background: #e6e5e2; overflow: hidden; touch-action: none; }
    body { display: flex; align-items: center; justify-content: center; font: 13px/1.4 system-ui, sans-serif; }
    main { display: grid; }
    main canvas { grid-area: 1 / 1; display: block; max-height: 100vh; max-width: 100vw; width: auto !important; height: auto !important; }
    #lines { mix-blend-mode: multiply; position: relative; z-index: 1; }
    /* the pointer is a small animated scribble (cursor.js) */
    *, *::before, *::after { cursor: none !important; }
    #start { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(230,229,226,.45); transition: opacity .5s; }
    #start span { padding: 14px 24px; border-radius: 999px; background: #2a2725; color: #f3ede6; font: 600 16px/1 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
    #start.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <main></main>
  <script>
    window.WASH_IMAGE = "data/washes.jpg?v=9";
    window.DEFAULTS = { ghost: 1 };
  </script>
  <div id="start"><span>tap to start</span></div>
  <script src="sound.js?v=9"></script>
  <script src="cursor.js?v=9"></script>
  <script src="wash.js?v=9"></script>
  <script src="animate.js?v=9"></script>
</body>
</html>
